<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#FFFFFF" />
    <script>
      // Resolve before CSS and React load to prevent an incorrect-theme flash.
      ;(() => {
        let saved = null
        try {
          saved = localStorage.getItem('cualli-theme')
        } catch {
          // System preference still works if storage is blocked.
        }
        const dark =
          saved === 'dark' ||
          (saved !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#000000' : '#FFFFFF')
      })()
    </script>
    <style>
      html {
        background: #fff;
        color: #102a43;
      }
      html.dark {
        background: #000;
        color: #fff;
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Cualli is developing engineered probiotic technology to investigate the capture of PFAS and other persistent environmental contaminants in the gastrointestinal tract. Efficacy in humans has not been established."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cualli  | Filter the Forever" />
    <meta
      property="og:description"
      content="Investigating a biological approach to persistent environmental contaminants through engineered probiotic technology. Efficacy in humans has not been established."
    />
    <title>Cualli | Filter the Forever</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
